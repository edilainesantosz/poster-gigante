<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pôster Gigante</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1> Pôster Gigante</h1>
        <p>Transforme uma imagem em um pôster grande para imprimir em folhas A4.</p>
    </header>

    <main>

        <section class="caixa">

            <h2>Crie seu pôster</h2>

            <p>Escolha uma imagem do seu computador:</p>

            <input type="file" id="imagem" accept="image/*">

            <div class="configuracoes">

                <label for="largura">
                    Largura do pôster (cm)
                </label>

                <input 
                    type="number" 
                    id="largura" 
                    value="80"
                    min="10"
                >

                <label for="altura">
                    Altura do pôster (cm)
                </label>

                <input 
                    type="number" 
                    id="altura" 
                    value="60"
                    min="10"
                >

            </div>

            <button id="gerar">
                Gerar pôster
            </button>

            <div id="resultado"></div>

        </section>

    </main>

    <footer>
    <p>Pôster Gigante • Gratuito</p>
    <p>Desenvolvido por 
        <a href="https://www.instagram.com/edilainesantosz/" target="_blank">
            @edilainesantosz
        </a>
    </p>
</footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js"></script>

</body>
</html>
